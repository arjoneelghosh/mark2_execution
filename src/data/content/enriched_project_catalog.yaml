    narrative_draft:
      - "FlightFinder AI stands out because the project framing is unusually clear even before any final copywriting. Both the local `ViklangFlightBooking` folder and the public GitHub repository describe the same core concept: a flight-booking experience adapted for users with different communication needs rather than a generic booking clone. The accessibility angle is not a vague label in this case; it appears in the actual structure of the project through role-adaptive UI flows, references to ASL support, voice input, and an assistant-style interaction model."
      - "From the evidence available, the project seems to span a real full-stack boundary. The frontend stack points to a Next.js application with motion and accessibility-aware interaction patterns, while the backend points to a FastAPI service for authentication, flight search, chat-style flows, and history. The repo structure and summary files also suggest that external integrations were part of the intended story, including Amadeus for flight data and OpenRouter-style AI support. That gives the project a stronger product identity than many hackathon-style demos, even though the exact end-to-end completeness of those integrations is still uncertain."
      - "The right narrative for now is strong but careful: this is a substantial accessibility-focused prototype, not yet a verified shipped product. The evidence supports saying the system was designed to make booking more usable for deaf, mute, blind, and standard users, and that it combined adaptive UX with backend services and assistive input ideas. What still needs user confirmation is which parts were fully operational in practice, whether the gesture and voice paths worked live, and which screenshots or demo moments best represent the project visually."
    uncertainty_notes:
      - "Do not claim live end-to-end API success without confirmation."
      - "ASL and voice features should be described conservatively until verified."
    missing_info:
