projects:
  - canonical_title: "AgriFore"
    canonical_slug: "agrifore"
    treatment: featured
    source_of_truth: merged
    confidence: high
    narrative_draft:
      - "AgriFore reads like the strongest representative of your agriculture forecasting work because it combines several layers that usually live in separate prototypes: data processing, model artifacts, an API surface, and a dashboard layer. Across the local Desktop folders and the GitHub repo, the project consistently points to the same core idea: bringing together production, weather, and market signals into a single forecasting-oriented system. The local evidence is especially strong because it includes figure packs, simulation outputs, and repo-level reports that make the work easier to explain than a code-only repository would."
      - "The technical shape is grounded enough to describe without overstating it. The project appears to use a DuckDB-centered ETL and feature pipeline, model artifacts stored locally, a FastAPI backend, and a Next.js frontend for dashboard-style access to predictions and market intelligence. That combination gives it a more complete product feel than a notebook-only forecasting project. The presence of paper-style artifacts and figure-generation work also suggests this project was not just a coding exercise, but something you were trying to package into a more coherent technical narrative."
      - "The main caution is not whether the project exists, but how confidently it can be framed. The evidence supports describing it as a research prototype or forecasting platform, but not yet making hard claims about production deployment quality, model performance, or your exact ownership split across ETL, modeling, frontend, backend, and report writing. The strongest near-term portfolio version would present AgriFore as an integrated agriculture forecasting system, while treating the Kamareddy-only branches and earlier rainfall-correlation work as support and lineage rather than separate products."
    uncertainty_notes:
      - "Do not claim production maturity or performance metrics yet."
      - "Ownership split still needs manual confirmation."
    missing_info:
      - "Exact ownership across ETL, modeling, backend, frontend, and paper work."
      - "Best public-facing deployment or demo proof."

