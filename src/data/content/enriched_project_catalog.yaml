      - "The implementation details are also concrete enough to support a grounded narrative. The project points to a Streamlit-based frontend with webcam support, MediaPipe hand landmark extraction, and TensorFlow/Keras models organized by language. That suggests a pipeline where hand landmarks serve as structured input features rather than raw images alone. It also gives the project a useful technical identity: lightweight, explainable, and practical enough for a live demo if the models were working consistently. The precursor folders reinforce this interpretation by showing earlier gesture- and landmark-based experimentation that appears to feed into the final SignChat concept."
      - "The uncertainty here is mostly around scope and maturity, not around legitimacy. The evidence supports describing SignChat as a prototype for live sign-language interpretation, but it does not yet support firm claims about dataset size, language coverage, model quality, or measured accuracy. The safest narrative is to present it as a promising assistive ML build with a clear input-to-text workflow, while keeping the older gesture-recognition folders in the background as lineage rather than inflating them into separate portfolio projects."
    uncertainty_notes:
      - "Avoid claiming accuracy, dataset scale, or complete language coverage."
