  - canonical_title: "FlightFinder AI"
    canonical_slug: "flightfinder-ai"
    treatment: "featured"
    source_of_truth: "local"
    confidence: "medium"

    objective: "Create an accessible flight-search assistant that adapts the interface and interaction style to different disability profiles while combining conversational routing, flight-search APIs, trip history, and sign-language support attempts."
    project_story: "The repo frames FlightFinder AI as an accessibility-first travel interface built during a hackathon-style effort. The strongest evidence shows a FastAPI backend with dedicated routers for chat, flights, trip history, and ASL recognition, paired with documentation that emphasizes role-adaptive layouts and multimodal interaction."
    user_or_system_workflow:
      - "A user enters the product under a role such as deaf or blind, and the frontend is documented as changing pane emphasis so chat, itinerary panels, and controls are weighted differently by accessibility need."
      - "Conversation requests are sent to the chat router, where OpenRouter-backed prompts try to extract intents such as flight search, booking, viewing trips, or starting a new search."
      - "Flight lookups go through the Amadeus-backed route with a mock fallback, trip management persists user history, and ASL requests can be routed to camera or recognition endpoints if that flow is enabled end to end."

    system_pipeline:
      - "`backend/app/main.py` initializes the FastAPI application, database tables, request logging, and mounted routers."
      - "`chat_routes.py` shapes role-aware system prompts and parses structured control markers from LLM output so the backend can decide whether to invoke search, trip, or booking-related actions."
      - "`flight_routes.py`, `trip_routes.py`, and `asl_service.py` handle external flight data, stored trip records, and sign-recognition inference or preprocessing respectively."

    architecture_explainer: "FlightFinder AI is a routed assistant rather than a single monolithic chat endpoint. The backend uses separate route groups for intent interpretation, flight offers, trip history, and ASL recognition; the documented frontend then arranges those capabilities differently depending on the user's accessibility profile."
    detailed_project_explanation:
      paragraph_1: "The problem statement in the repo is specific: standard flight-booking flows assume a narrow interaction model, while this project tries to support users who may prefer text-heavy, voice-assisted, or sign-mediated interaction. The documentation repeatedly describes role-adaptive layouts and accessibility-driven pane weighting, which gives the project a clearer product angle than a generic travel chatbot."
      paragraph_2: "The observed workflow begins with user role context and then branches by task. A chat request enters `chat_routes.py`, where a role-aware prompt is sent to OpenRouter and the response is parsed for markers such as `FLIGHT_SEARCH::`, `BOOK_FLIGHT`, `VIEW_TRIPS`, or `NEW_SEARCH`. When the task is flight search, the backend calls the Amadeus shopping API or returns mock data; when it is trip management, the trip router handles stored itinerary records. The repo also includes ASL routes for camera input and recognition, implying an intended multimodal loop even if the final product path is not fully proven."
      paragraph_3: "The technical implementation is more concrete than the README alone suggests. `main.py` wires middleware, routers, and table creation; `flight_routes.py` explicitly manages Amadeus tokens and `/v2/shopping/flight-offers`; `trip_routes.py` provides trip CRUD endpoints; and `asl_service.py` loads a bundled gesture-recognition stack with a palm detector, hand-landmark model, and pickled gesture classifier, then returns a predicted sign only above a confidence threshold. That means the backend contains real ASL-recognition code, even though project docs still describe ASL as simplified or not fully production ready."
      paragraph_4: "As a portfolio piece, FlightFinder AI is compelling because it ties accessibility framing to concrete backend routing decisions instead of stopping at UI mockups. The main uncertainty is delivery completeness: the docs admit no payment flow and limited production readiness, and there is a mismatch between documentation that downplays ASL inference and backend code that appears to attempt it, so the final narrative should present ASL as implemented experimentation rather than a confirmed polished feature."

    key_components:
      - name: "`backend/app/main.py`"
        role: "Initializes the FastAPI application, middleware, database setup, and router mounting."
        evidence: "The file creates tables and includes auth, chat, flight, trip, and ASL routers."
      - name: "`backend/app/routes/chat_routes.py`"
        role: "Turns chat messages into structured intents using role-aware prompting and marker parsing."
        evidence: "The route logic looks for control strings such as `FLIGHT_SEARCH::` and `VIEW_TRIPS`."
      - name: "`backend/app/routes/flight_routes.py`"
        role: "Queries flight offers and falls back to mock data when external search is unavailable."
        evidence: "The file requests Amadeus tokens and calls the shopping-flight-offers API."
      - name: "`backend/app/routes/trip_routes.py`"
        role: "Stores and retrieves user trip history."
        evidence: "The router defines trip-management endpoints rather than leaving trip history as a README claim."
      - name: "`backend/app/services/asl_service.py`"
        role: "Processes image input and runs gesture-recognition inference over a bundled hand-sign pipeline."
        evidence: "The service loads palm-detection and landmark models plus `gesture_clf.pkl`, then returns recognized signs above a confidence threshold."

    data_and_inputs:
      - "User role context and conversational prompts."
      - "Flight search parameters passed to the Amadeus search flow."
      - "Trip-history records stored through backend routes."
      - "Camera or image payloads submitted to ASL recognition endpoints."
    outputs_and_interfaces:
      - "Role-adaptive frontend panes described in the repo documentation."
      - "Conversational responses and intent-driven flight search results."
      - "Stored trip history views."
      - "ASL recognition responses when the camera path is active."

    confirmed_implementation_details:
      - "The backend is split into dedicated routers for chat, flights, trips, and ASL."
      - "The chat route parses structured control markers from LLM output."
      - "The flight route integrates with Amadeus and includes a fallback path."
      - "There is real ASL-recognition service code in the backend rather than only placeholder route names."
