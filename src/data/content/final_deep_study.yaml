  - canonical_title: "SignChat"
    canonical_slug: "signchat"
    treatment: "featured"
    source_of_truth: "local"
    confidence: "high"

    objective: "Provide a chat-style sign-language interface that turns webcam hand landmarks into predicted letters or tokens, keeps conversation threads separate by language, and presents the interaction in a messaging-oriented UI instead of a raw classifier demo."
    project_story: "SignChat is structured as a focused webcam-to-text prototype. The repo combines Streamlit, `streamlit-webrtc`, MediaPipe Hands, and TensorFlow-based model loading so that sign recognition is framed as an ongoing conversation with per-thread language selection rather than a one-off notebook prediction."
    user_or_system_workflow:
      - "A user opens the Streamlit app, passes the placeholder auth gate, creates or switches conversation threads, and selects ASL, BSL, or ISL for that thread."
      - "The webcam stream is processed frame by frame; detected hand landmarks are converted into a normalized feature vector and sent through a per-language classifier."
      - "Recognized letters are smoothed over a short prediction buffer, appended to thread state, and displayed in the chat-style interface where the user can clear text or insert a snapshot."

    system_pipeline:
      - "`app.py` boots the Streamlit app and delegates rendering to `signchat/ui.py`."
      - "`detector.py` uses MediaPipe Hands to extract landmarks, `feature.py` converts them into a 68-dimensional vector, and `models.py` loads a Keras model or a safe mock classifier for the selected language."
      - "Session-state helpers in `state.py` and `threads.py` isolate conversations, selected language, and recognized text across the UI."

    architecture_explainer: "SignChat is a lightweight real-time inference UI. Streamlit manages the interface and session state, the webcam component supplies frames, MediaPipe provides hand landmarks, feature engineering reduces those landmarks to a fixed numeric vector, and the selected language model returns class scores that are smoothed before text is committed to the visible thread."
    detailed_project_explanation:
      paragraph_1: "The repo is solving a narrower and more believable problem than generic 'sign-language translation': it is building a chat-like front end for letter or token recognition from webcam hand poses. The README explicitly scopes the project as a Streamlit plus WebRTC prototype with per-language model folders, mock-safe fallback behavior, and known gaps around temporal signs such as J or Z."
      paragraph_2: "The workflow is unusually clear for a prototype. `ui.py` creates a sidebar of conversations, lets the user open a new thread, choose the active language for that thread, and view recognized text inside a message-style layout. The live recognition panel captures video, exposes a text-clear action, and supports snapshot insertion, so the app behaves like a conversation workspace rather than just showing classifier confidence values."
      paragraph_3: "The technical path is concrete. `detector.py` runs MediaPipe Hands with `max_num_hands=1`, extracts landmarks, and draws the recognition HUD. `feature.py` centers landmarks around the wrist and normalizes by palm length, yielding 63 flattened coordinates plus 5 tip-to-wrist distances for a 68-dimensional feature vector. `models.py` then loads a language-specific Keras model when present, otherwise falls back to a mock classifier, and stabilizes predictions through thresholding, an eight-frame buffer, and majority smoothing before letters are appended to state."
      paragraph_4: "SignChat is strong portfolio material because it shows real-time CV preprocessing, model loading, session-aware UX design, and conservative engineering choices around fallback behavior and prediction smoothing. The main uncertainty is linguistic completeness: the README openly says BSL and ISL often need two-handed recognition and that temporal signs are not fully handled, so the portfolio narrative should describe the app as a thread-based sign-recognition prototype rather than a complete translator."

    key_components:
      - name: "`app.py`"
        role: "Initial Streamlit entry point that configures the page and starts the UI renderer."
        evidence: "The file is minimal and delegates app rendering to `render_app`."
      - name: "`signchat/ui.py`"
        role: "Builds the auth gate, conversation sidebar, language selection, webcam panel, and transcript controls."
        evidence: "The file defines the chat-style layout, new-thread controls, and clear or snapshot actions."
      - name: "`signchat/detector.py`"
        role: "Runs MediaPipe-based landmark extraction and recognition display logic."
        evidence: "The detector configures hand tracking, extracts points, and updates recognized text state."
      - name: "`signchat/feature.py`"
        role: "Encodes landmarks into the model input vector."
        evidence: "The feature builder outputs the documented 68-dimensional representation."
      - name: "`signchat/models.py`"
        role: "Loads per-language classifiers and stabilizes predictions."
        evidence: "The file handles Keras model loading, fallback mocks, thresholds, buffering, and majority voting."

    data_and_inputs:
      - "Live webcam frames supplied through `streamlit-webrtc`."
      - "Hand-landmark coordinates extracted by MediaPipe Hands."
      - "Per-thread language selection for ASL, BSL, or ISL."
    outputs_and_interfaces:
      - "Chat-style transcript text tied to a selected conversation thread."
      - "Recognition overlay or HUD on the webcam processing path."
      - "Sidebar thread management and thread-specific language context."

    confirmed_implementation_details:
      - "The feature vector is explicitly 68-dimensional."
      - "Prediction smoothing uses thresholding, buffering, and stable-majority logic."
      - "Conversation threads and selected language are stored in session state."
      - "The system supports mock-safe operation when a language model file is absent."
    uncertain_or_needs_confirmation:
      - "What exact label sets are trained inside each language-model folder."
