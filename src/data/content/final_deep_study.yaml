    objective: "Prototype a crop-planning and advisory workspace that combines local farm context, synthetic market and weather series, and a lightweight orchestrator for pricing and action-oriented farming guidance."
    project_story: "CropIQ is closer to an interactive planning sandbox than a finished farm platform. The repo shows a React and Zustand workspace where a farmer profile, crop plan, nearest-market mapping, and assistant responses are kept in browser state and used to drive pricing or advisory conversations."
    user_or_system_workflow:
      - "The user creates a plan through the harvest modal, which captures crop, sow date, acreage, and either auto-detected or manually entered location."
      - "The app maps the selected subdistrict to a nearest market, creates a chat or project record in local state, and opens the workspace with quick actions such as daily advice, post-harvest price questions, or pesticide-confession help."
      - "A submitted question is passed to `llmOrchestrator`, which either answers offline from local logic or uses an OpenRouter path when a key is configured."

    system_pipeline:
      - "Static Kerala farming context is generated in `data.ts`, including subdistricts, crops, ninety-day price histories, and short-horizon weather series."
      - "`engine.ts` decides whether to run an offline forecasting branch or an LLM-backed response, and it stores extra state such as MRL hold recommendations for pesticide-related scenarios."
      - "`store.ts` persists chats, selected conversations, and farm context in local storage so the workspace survives refreshes without a dedicated backend."

    architecture_explainer: "CropIQ is a client-heavy advisory prototype. Local data generation, forecasting heuristics, market mapping, and chat state all live in the frontend, with optional LLM calls layered on top rather than a clearly separate backend service."
    detailed_project_explanation:
      paragraph_1: "The repo indicates that CropIQ is intended to help a farmer reason about harvest timing, market pricing, and operational decisions inside a single workspace. Instead of starting from a backend service, it models farm plans, subdistricts, market links, and a few common advisory prompts directly in the frontend so that the experience feels like a guided operations console."
      paragraph_2: "The workflow is encoded in components rather than described abstractly. `HarvestModal.tsx` creates the initial farm context and nearest-market mapping, `Workspace.tsx` turns that context into a persistent chat thread with quick action buttons, and `engine.ts` branches by prompt intent. Price questions use a simple forecasting routine, 'today' advice assembles an operations response from local signals, and pesticide-confession prompts can set an MRL-hold flag in persisted state."
      paragraph_3: "This project is worth keeping because the workflow is unusually legible for a prototype and the repo shows clear product thinking around farmer-specific chat states, market context, and actionable prompt categories. The main limitation is realism: the market and weather series are synthetic, the forecasting labels such as 'XGB' and 'Prophet' refer to heuristic logic rather than confirmed full model integrations, and any OpenRouter-backed path should be described as optional rather than core."
