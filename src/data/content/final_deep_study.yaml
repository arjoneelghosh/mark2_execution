projects:
  - canonical_title: "AgriFore"
    canonical_slug: "agrifore"
    treatment: "featured"
    source_of_truth: "local"
    confidence: "high"

    objective: "Build a commodity intelligence workflow for agricultural markets by combining cleaned mandi and weather data, district-aware forecasting experiments, a FastAPI service layer, and a Next.js dashboard for exploration and prediction."
    project_story: "AgriFore is not just a single model notebook. The repo shows a staged market-intelligence project that starts with Telangana mandi and weather processing in DuckDB, trains multiple forecasting layers, and exposes the results through an API consumed by a dashboard and prediction form."
    user_or_system_workflow:
      - "An operator runs the DuckDB pipeline in `AgricultureProd/run_duckdb_pipeline.ps1`, which sequentially executes SQL scripts for data loading, views, coverage checks, outlier handling, seasonal alignment, weather feature generation, and model datasets."
      - "Model scripts then train or evaluate forecasting layers: `AgricultureProd/tools/train_model1_xgboost.py` compares district versus global strategies for production-side forecasting, while `AgriMarket/train_model2_base.py` and `AgriMarket/train_model2_adjust.py` create market-price forecasts and a residual adjustment stage."
      - "The frontend dashboard loads market overview, top commodities, clusters, and trend endpoints in parallel, and the prediction form fetches commodity, market, and district options before posting a forecasting request to the FastAPI backend."

    system_pipeline:
      - "Raw agriculture and weather inputs are normalized in DuckDB views such as `v_model2_base_dataset` and `v_model2_adjust_dataset`, with explicit feature-engineering stages for seasonal and weather-derived signals."
      - "The base market model builds lag, rolling, cyclical, and weather features before training XGBoost, LightGBM, or a histogram-gradient-boosting fallback, then writes prediction CSVs, metrics, and serialized model bundles."
      - "The adjustment model consumes the base model's out-of-fold predictions and learns residual corrections with RidgeCV, after which `api/server.py` serves both analytics endpoints and a live `/predict-price` inference path."

    architecture_explainer: "AgriFore is organized as an offline data-and-model pipeline plus an online analytics interface. DuckDB SQL scripts prepare consistent analytical views, Python training scripts materialize forecasts and diagnostics, FastAPI exposes both descriptive analytics and prediction endpoints, and the Next.js frontend renders the dashboard and forecast form using those APIs."
    detailed_project_explanation:
      paragraph_1: "The strongest evidence in AgriFore points to a market-intelligence workflow for agriculture rather than a generic farm app. `REPO_FULL_REPORT.md` and the training scripts show separate concern areas for production and market-price modeling, with Telangana mandi and weather signals feeding a forecasting stack that tries to explain both broad trends and district-level variation."
      paragraph_2: "The user-facing flow starts after offline preparation. The dashboard home page requests market overview cards, top commodities, cluster summaries, and trend series together, while the prediction form walks the user through selecting a commodity, market, and district before sending those inputs to `/predict-price`. The API also exposes supporting views such as seasonal series, arrivals, and price-trend endpoints, which indicates that the product is meant for analysis as well as point prediction."
      paragraph_3: "Implementation depth is concentrated in the data and modeling folders. `run_duckdb_pipeline.ps1` chains explicit SQL stages, `train_model1_xgboost.py` acts as a large experiment-and-diagnostics script for district versus global modeling choices, `train_model2_base.py` builds the main price model with lags and weather features, and `train_model2_adjust.py` learns a residual correction layer using base predictions plus yield, arrivals, rain, humidity, and normalized seasonal signals. `api/server.py` loads model assets and also falls back to precomputed prediction CSVs, which suggests the serving layer was designed to work even when some online inference dependencies are unavailable."
      paragraph_4: "As a portfolio piece, AgriFore matters because the repo demonstrates a full analytical chain from SQL feature engineering through model comparison, residual modeling, API design, and frontend consumption. What remains uncertain is deployment maturity, the exact freshness of the packaged model artifacts, and how much of the conversational `/ask-agent` path was productionized compared with the clearly implemented analytics and forecasting endpoints."

    key_components:
      - name: "`AgricultureProd/run_duckdb_pipeline.ps1`"
        role: "Orchestrates the DuckDB data-preparation pipeline by running ordered SQL scripts for ingestion, cleaning, diagnostics, and model-dataset creation."
        evidence: "The script explicitly invokes numbered `.sql` files from raw loading through `50_model1_dataset.sql`."
      - name: "`AgriMarket/train_model2_base.py`"
        role: "Creates the base market-price forecasting model and writes predictions, metrics, out-of-fold results, and serialized artifacts."
        evidence: "The script reads `v_model2_base_dataset`, engineers lag and rolling features, trains gradient-boosting variants, and saves outputs such as `m2_base_predictions_2024.csv`."
      - name: "`AgriMarket/train_model2_adjust.py`"
        role: "Learns a second-stage residual adjustment model over the base forecast outputs."
        evidence: "The script merges OOF base predictions, computes residuals, fits RidgeCV, and writes adjustment metrics and metadata."
      - name: "`api/server.py`"
        role: "Serves commodity, market, seasonal, trend, cluster, and forecast endpoints for the frontend."
        evidence: "The file defines routes including `/market-overview`, `/price-trends`, `/seasonal-data`, `/arrival-data`, `/predict-price`, and `/ask-agent`."
      - name: "`frontend/app/page.tsx` and `frontend/components/prediction/PredictionForm.tsx`"
        role: "Render the analytics dashboard and user-driven forecast submission flow."
        evidence: "The page loads multiple analytics requests in parallel and the prediction form fetches dropdown data before posting forecast requests."

    data_and_inputs:
      - "Telangana mandi market data prepared through DuckDB SQL stages."
      - "Weather data loaded and transformed via `05_load_weather_v2.sql`, `15_weather_features.sql`, and `17_weather_seasonal.sql`."
      - "User-selected commodity, market, and district inputs submitted from the frontend prediction form."
    outputs_and_interfaces:
      - "Dashboard cards and charts for market overview, commodity summaries, cluster summaries, and trend series."
      - "Prediction API responses for market-price forecasts."
      - "Generated CSVs, metrics files, model bundles, and figures under report or figure folders."

    confirmed_implementation_details:
      - "DuckDB is used as a repeatable transformation layer rather than ad hoc notebook preprocessing."
      - "The market-price stack contains a base model and a residual adjustment stage."
      - "FastAPI routes are wired to frontend service calls for both analytics and prediction."
      - "The frontend prediction flow is implemented with actual API integration rather than static mock text."
